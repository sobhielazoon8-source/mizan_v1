name: update-and-deploy

on:
  schedule:
    - cron: "*/10 * * * 5,6,0,1"   # كل 10 دقائق من الجمعة إلى الاثنين (أيام المباريات)
    - cron: "17 */2 * * 2,3,4"     # كل ساعتين في بقية الأسبوع
  workflow_dispatch:             # تشغيل يدوي من تبويب Actions
  push:
    branches: [main]

permissions:
  contents: write              # لحفظ سجلّ التوقعات في المستودع
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: جلب أحدث جدول ونتائج (openfootball، ترخيص CC0)
        run: |
          git clone --depth 1 https://github.com/openfootball/england openfootball/england
          git clone --depth 1 https://github.com/openfootball/champions-league openfootball/champions-league || echo "تعذّر جلب دوري الأبطال"
          for r in espana deutschland italy france; do
            git clone --depth 1 https://github.com/openfootball/$r openfootball/$r || echo "تعذّر جلب $r"
          done

      - name: حساب التوقعات
        env:
          OF_DIR: openfootball/england
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python3 -I src/predict.py | tee predict.log
          M=$(grep -a -E "football-data|مكمَّلة|تعذّر" predict.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=مصادر-النتائج::$M"


      - name: توقعات الدوريات الأوروبية (إسباني، ألماني، إيطالي، فرنسي)
        env:
          OF_ROOT: openfootball
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set +e
          for c in es de it fr; do
            python3 -I src/predict_league.py $c 2>&1 | tee -a leagues.log
            [ ${PIPESTATUS[0]} -eq 0 ] || echo "فشل الدوري $c" | tee -a leagues.log
          done
          M=$(grep -a -E "اختبار رجعي|فشل|تعذّر|مكمَّلة" leagues.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=الدوريات::$M"
          exit 0

      - name: توقعات دوري أبطال أوروبا
        env:
          CL_ROOT: openfootball/champions-league
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set +e
          python3 -I src/predict_cl.py 2>&1 | tee cl.log
          M=$(grep -a -E "اختبار رجعي|فشل|تعذّر|مكمَّلة|لا مباريات" cl.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=دوري-الأبطال::$M"
          exit 0

      - name: حفظ سجلّ التوقعات في المستودع
        run: |
          git config user.name "mizan-bot"
          git config user.email "mizan-bot@users.noreply.github.com"
          git add data/predictions_log*.json data/odds_history*.json
          if ! git diff --cached --quiet; then
            git commit -m "تحديث سجلّ التوقعات"
            git pull --rebase origin main
            git push origin main
          else
            echo "لا تغييرات في السجل"
          fi

      - name: بناء الصفحة
        run: python3 -I src/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
