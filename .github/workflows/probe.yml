name: probe-api-football
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe API-Football (free plan)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set +e
          python3 -I tools/probe_api.py
          if [ -f probe_result.txt ]; then
            M=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' probe_result.txt | cut -c1-3500)
            echo "::notice title=probe::$M"
          fi
